name: Lint and Test

on:
  push:
    branches: [main, gui]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-web.txt pytest ruff
      - name: Lint
        run: ruff check recorder_core gui_desktop web tests main.py gui.py web_server.py
      - name: Test
        env:
          DLR_SKIP_AUTO_INSTALL: "1"
        run: pytest -q
